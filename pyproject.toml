[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-aware-mvp"
version = "0.1.0"
description = "Minimal conservative SLA-safe evaluator for fixed layer-level LLM pipelines"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]


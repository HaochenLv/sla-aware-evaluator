name: HELIX Fixed Reference Validation

on:
  push:
    branches:
      - feat/helix-fixed-pipeline-reference
  pull_request:
    branches:
      - feat/reference-evaluator-v0
      - feat/helix-fixed-pipeline-reference
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evaluator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run evaluator unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3

      - name: Install HELIX simulator runtime dependencies
        run: python -m pip install 'networkx~=3.2.1' 'matplotlib~=3.8.2'

      - name: Run fixed-pipeline HELIX smoke
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
          MPLBACKEND: Agg
        run: |
          mkdir -p outputs
          PYTHONPATH=src python -m sla_aware_mvp.helix_fixed_reference_demo > outputs/helix_fixed_reference_smoke.json
          python -m json.tool outputs/helix_fixed_reference_smoke.json

      - name: Run 30s Conservative vs HELIX capacity experiment
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
          MPLBACKEND: Agg
        run: |
          PYTHONPATH=src python -m sla_aware_mvp.helix_fixed_capacity_demo > outputs/helix_fixed_capacity_30s.json
          python -m json.tool outputs/helix_fixed_capacity_30s.json

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: helix-fixed-reference-results
          path: |
            outputs/helix_fixed_reference_smoke.json
            outputs/helix_fixed_capacity_30s.json

name: Prefill Debt Budget Ablation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HELIX runtime dependencies
        run: python -m pip install 'networkx~=3.2.1' 'matplotlib~=3.8.2'
      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3
      - name: Compare guard-only and budget-consistent debt
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
        run: |
          mkdir -p outputs
          PYTHONPATH=src python -m sla_aware_mvp.prefill_debt_budget_ablation > outputs/prefill-debt-budget-ablation.json
          cat outputs/prefill-debt-budget-ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: prefill-debt-budget-ablation
          path: outputs/prefill-debt-budget-ablation.json

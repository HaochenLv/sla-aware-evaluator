name: HELIX Prefill Decode Blocking Sweep

on:
  push:
    branches:
      - exp/helix-prefill-decode-blocking-sweep
  workflow_dispatch:

jobs:
  blocking-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - helix-fast-link-placement
          - helix-slow-link-placement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3
      - name: Install HELIX runtime dependencies
        run: python -m pip install 'networkx~=3.2.1' 'matplotlib~=3.8.2'
      - name: Run two-query blocking sweep
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
          MPLBACKEND: Agg
          SWEEP_PIPELINE: ${{ matrix.pipeline }}
        run: |
          mkdir -p outputs
          label=$(echo "${SWEEP_PIPELINE}" | sed 's/helix-//' | sed 's/-link-placement//')
          PYTHONPATH=src python -m sla_aware_mvp.helix_prefill_decode_sweep > outputs/prefill-decode-${label}.json
          cat outputs/prefill-decode-${label}.json
      - uses: actions/upload-artifact@v4
        with:
          name: prefill-decode-${{ matrix.pipeline }}
          path: outputs/*.json

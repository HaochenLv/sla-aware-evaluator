name: E31 Seed19 Tightness Diagnostic

on:
  pull_request:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HELIX runtime dependencies
        run: python -m pip install 'networkx~=3.2.1' 'matplotlib~=3.8.2'
      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3
      - name: Diagnose seed19 Slow tightness gap
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
          MPLBACKEND: Agg
        run: |
          mkdir -p outputs
          PYTHONPATH=src python -m sla_aware_mvp.seed19_tightness_diagnostic_fast > outputs/e31-seed19-tightness-diagnostic.json
          cat outputs/e31-seed19-tightness-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: e31-seed19-tightness-diagnostic
          path: outputs/e31-seed19-tightness-diagnostic.json

name: Heterogeneous Network Redline Validation

on:
  pull_request:
    paths:
      - 'src/sla_aware_mvp/heterogeneous_network_redline_validation.py'
      - '.github/workflows/heterogeneous-network-redline-validation.yml'
      - 'PROJECT_STATUS.md'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        prompt_tokens: [1024, 1709]
        pattern: [mild, one_bottleneck]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HELIX runtime dependencies
        run: python -m pip install 'networkx~=3.2.1' 'matplotlib~=3.8.2'
      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3
      - name: Validate heterogeneous weighted red line
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
          PROMPT_TOKENS: ${{ matrix.prompt_tokens }}
          HETERO_PATTERN: ${{ matrix.pattern }}
        run: |
          mkdir -p outputs
          PYTHONPATH=src python -m sla_aware_mvp.heterogeneous_network_redline_validation > outputs/prompt-${{ matrix.prompt_tokens }}-${{ matrix.pattern }}.json
          cat outputs/prompt-${{ matrix.prompt_tokens }}-${{ matrix.pattern }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: heterogeneous-redline-${{ matrix.prompt_tokens }}-${{ matrix.pattern }}
          path: outputs/prompt-${{ matrix.prompt_tokens }}-${{ matrix.pattern }}.json

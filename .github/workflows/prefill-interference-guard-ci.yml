name: Prefill Interference Guard Capacity Scan

on:
  pull_request:
    branches:
      - feat/helix-fixed-pipeline-reference
  workflow_dispatch:

jobs:
  guard-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3
      - name: Run observational guard scan
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
        run: |
          mkdir -p outputs
          PYTHONPATH=src python -m sla_aware_mvp.prefill_interference_guard_demo > outputs/prefill-interference-guard.json
          cat outputs/prefill-interference-guard.json
      - uses: actions/upload-artifact@v4
        with:
          name: prefill-interference-guard
          path: outputs/prefill-interference-guard.json

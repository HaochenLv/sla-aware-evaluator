name: Exact Singleton Plus Prefill Guard

on:
  pull_request:
    branches:
      - exp/evaluator-exact-singleton-decode-alignment
  workflow_dispatch:

jobs:
  guarded-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout pinned HELIX simulator
        run: |
          git clone https://github.com/Thesys-lab/Helix-ASPLOS25.git /tmp/Helix-ASPLOS25
          git -C /tmp/Helix-ASPLOS25 checkout 8639497a4aaf1eb3b7594614cb0bbd376c1342b3
      - name: Run guarded scan
        env:
          HELIX_ROOT: /tmp/Helix-ASPLOS25
        run: |
          mkdir -p outputs
          PYTHONPATH=src python -m sla_aware_mvp.exact_singleton_prefill_guard_demo > outputs/exact-singleton-prefill-guard.json
          cat outputs/exact-singleton-prefill-guard.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-singleton-prefill-guard
          path: outputs/exact-singleton-prefill-guard.json
